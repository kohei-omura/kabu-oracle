name: dashboard

on:
  schedule:
    - cron: "35 22 * * 0-4"   # 07:35 JST
    - cron: "0 2 * * 1-5"     # 11:00 JST
    - cron: "30 5 * * 1-5"    # 14:30 JST
    - cron: "30 7 * * 1-5"    # 16:30 JST（大引け後・確定終値）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build dashboard
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python main.py report
      - name: Commit & push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "update dashboard [skip ci]"
          git pull --rebase --autostash || true
          git push
